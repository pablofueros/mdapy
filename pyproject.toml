[project]
name = "mdapy-v2"
version = "2.0.0"
description = "Maximum Dissimilarity Algorithm in Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pablo Garcia", email = "pablofueros@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11.2",
]
[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "plotly>=7.1,<8",
    "pytest>=7.0",
    "pytest-cov>=4.1",
    "ty>=0.0.85,<1.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mdapy"

[project.urls]
Repository = "https://github.com/pablofueros/mdapy-v2"
Issues = "https://github.com/pablofueros/mdapy-v2/issues"
"Original project" = "https://github.com/IHCantabria/mdapy"

[tool.ruff]
lint.extend-select = ["F", "I"]
force-exclude = true
